<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Body -->
  <rect x="12" y="14" width="40" height="30" rx="8" fill="#60a5fa"/>
  <!-- Roof -->
  <rect x="16" y="10" width="32" height="6" rx="3" fill="#3b82f6"/>
  <!-- Pantograph -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="4" x2="38" y2="4" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Windows -->
  <rect x="17" y="19" width="12" height="10" rx="2" fill="#dbeafe"/>
  <rect x="35" y="19" width="12" height="10" rx="2" fill="#dbeafe"/>
  <!-- Door -->
  <rect x="30" y="22" width="4" height="12" rx="1" fill="#1e40af"/>
  <!-- Bumper -->
  <rect x="10" y="44" width="44" height="4" rx="2" fill="#475569"/>
  <!-- Wheels -->
  <circle cx="22" cy="52" r="5" fill="#334155"/>
  <circle cx="22" cy="52" r="2.5" fill="#94a3b8"/>
  <circle cx="42" cy="52" r="5" fill="#334155"/>
  <circle cx="42" cy="52" r="2.5" fill="#94a3b8"/>
  <!-- Headlight -->
  <circle cx="16" cy="38" r="2.5" fill="#fbbf24"/>
  <circle cx="48" cy="38" r="2.5" fill="#fbbf24"/>
</svg>
